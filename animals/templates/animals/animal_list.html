<!DOCTYPE html>
<html>
<head>
    <title>Animal Explorer</title>
</head>
<body>

    <h1>Animal Explorer</h1>

    {% for animal in animals %}
        <h2>
                <a href="{% url 'animal_detail' animal.id %}">
        {{ animal.name }}
    </a>

        </h2>
        
        <p><em>{{ animal.scientific_name }}</em></p>
    {% endfor %}

</body>
</html>
