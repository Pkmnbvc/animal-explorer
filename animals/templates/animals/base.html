{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Animal Explorer{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'animals/css/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <a class="brand" href="/animals/">
                <span class="brand-paw">🐾</span>
                <span class="brand-animal">Animal</span>
                <span class="brand-explorer">Explorer</span>
            </a>

<div class="nav-links">
    <a href="/animals/">Home</a>
    <a href="{% url 'categories' %}">Categories</a>
    <a href="/animals/#about">About</a>
</div>
<form class="search-box"
      method="get"
      action="{% url 'search_animals' %}">

    <input
        type="text"
        name="q"
        placeholder="Search animals..."
        aria-label="Search animals"
    >

    <button type="submit" class="search-button">
        🔍
    </button>

</form>

        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
