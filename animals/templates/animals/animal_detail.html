<!DOCTYPE html>
<html>
<head>
    <title>{{ animal.name }} | Animal Explorer</title>
</head>
<body>

    <h1>{{ animal.name }}</h1>

    <p><em>{{ animal.scientific_name }}</em></p>

    {% if animal.image %}
        <img src="{{ animal.image.url }}" alt="{{ animal.name }}">
    {% endif %}



    <p><strong>Diet:</strong> {{ animal.diet }}</p>

    <p><strong>Habitat:</strong> {{ animal.habitat }}</p>

    <p><strong>Lifespan:</strong> {{ animal.lifespan }}</p>

    <h2>Fun Fact!</h2>
    <p>{{ animal.fun_fact }}</p>

</body>
</html>
